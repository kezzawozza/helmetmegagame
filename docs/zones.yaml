# Source of truth for the game's Zones, their Locations and each Location's
# Rooms, hand-edited then pushed with `npm run db:sync-zones`
# (db/lib/syncZones.js). This sync is fully destructive in both directions:
# entries here are upserted into the DB and Discord by `id` slug, and any
# Zone/Location/Room NOT listed here gets its Discord objects deleted and its
# DB row removed — for a Zone that means a whole category, its #summary and
# its "Zone: {Name}" role; for a Location its channel; for a Room one thread.
# Removing an entry is a real delete — there's no undo short of re-adding it
# (which provisions brand-new Discord objects, since a removed/re-added entry
# loses its old Discord IDs).
#
# Zones, levels, locations and rooms are maps keyed by `id` (`town:`, not
# `- id: town`). See docs/tags.yaml's header for why, and db/lib/yamlEntries.js.
#
# A ZONE is a region: a Discord category, a #summary channel anyone in the
# zone reads, and a "Zone: {Name}" role. A LOCATION is where a character
# actually STANDS: one text channel under the zone's category. A Location
# wears NO role — the channel is opened to whoever is standing in it by a
# per-member permission overwrite, because 56 locations would otherwise have
# eaten 56 of the guild's 250 roles. A ROOM is a thread under its Location's
# channel — public (a public thread everyone in the Location sees) or private
# (a private thread whose members are exactly the characters holding one of
# its `access:` tag slugs; the bot adds and removes them as tags come and go).
# Every presence zone needs at least one Location, and a Location may have no
# Rooms.
#
# - id: a stable slug, used to match this entry to its DB row across syncs.
#   Zones, locations and rooms share ONE slug namespace.
#
#   **A ROOM's id is always `<location-stem>-<room>`** — `keep-throne-room`,
#   `inn-cellar`, `customs-watchtower`. The stem is the Location's short name,
#   not always its literal id (`old-cock-inn` gives `inn-`, `forest-headwaters`
#   gives `headwaters-`). Follow it and a collision is impossible; three rooms
#   in this file used to carry a comment explaining which id was already taken,
#   and the rule replaces all of them. Display `name` is untouched by this:
#   two rooms may both be called "Road" as long as their ids differ.
#
#   Renaming an entry
#   later means changing `name` here, NOT `id` — a changed `id` is treated as
#   a brand-new entry (old one pruned, new one provisioned from scratch)
#   instead of a rename. A Location's id is also its Discord channel name.
# - name: display name (Title Case). Only used as the Discord channel/
#   category/role name the FIRST time an entry is provisioned — renaming it
#   here later does not rename already-provisioned Discord objects. The
#   channel doctor matches on these, so keep them plain.
# - description: prose. A Location's is the -# subtext on its channel's
#   pinned anchor and the channel topic; a Room's is its thread's starter
#   message.
# - map_node (locations only): the node's number on Bascinet's hand-drawn
#   map, so the file and the drawing can be lined up. Authoring metadata
#   only — there is no column for it and no code reads it.
# - indoors (locations only): true for a place you walk INTO rather than
#   across. A cart or a mount is unequipped on arrival, with a DM, and cannot
#   be equipped while a character stands here — so its carry bonus is parked
#   at the door with it (docs/systemdocs/CARRY.md §3). The anchor message says
#   so in a -# line of its own, written by syncZones, so nobody has to be told
#   twice. Default false; a Room never carries it, since a Room is inside its
#   Location by definition.
# - attributes (locations only): a map of extra facts about the place, keyed
#   by the registry in db/lib/locationAttributes.js. Each one the Examine
#   button turns into a sentence. A key the registry does not know is a sync
#   PROBLEM, not a silent skip, because a typo would otherwise be a place that
#   never says what it is. `indoors` is deliberately NOT one of these — it is a
#   real column that mounts and carts act on — but Examine prints it alongside
#   them as though it were.
# - stash (rooms only): what is simply THERE in the room, like the Sanctuary
#   operating theatre's surgical instruments. Two shapes, both accepted:
#
#       stash: [surgical-equipment]          # the short one: each slug, x1
#
#       stash:                               # the long one, with quantities
#         resources: 24
#         items:
#           obol: 3
#           cleaning-powder: 1
#
#   A SEED, never a reset and never a top-up. An item the room already carries
#   is left exactly as the players left it, and `resources` is written only
#   while the room still holds none — so re-syncing can neither undo a player
#   carrying the anvil off nor quietly duplicate it. Tags sync AFTER zones, so
#   an unknown slug is skipped with a warning rather than throwing.
# - structures (locations only): what was simply always STANDING there, like
#   the Square's cross. A flat list of tag slugs that carry a `placement:`
#   block in docs/tags.yaml:
#
#       structures: [crucifix]
#
#   Seeded as one COMPLETE Structure each, with no builder and no payer. The
#   same FLOOR rule as a stash: nothing is created while one of that type is
#   already standing or going up, and a razed or abandoned one is re-raised
#   on the next sync. Tags sync AFTER zones, so on a database that has never
#   had db:sync-tags the first zone sync warns and skips — run db:sync-zones
#   again after the tags land (LAUNCH.md §5 does).
# - access (rooms only): a list of Tag slugs from docs/tags.yaml. Non-empty
#   makes the room PRIVATE, admitting anyone holding ANY of the listed tags.
#   Slugs aren't checked against the tag catalog here (tags sync after
#   zones); a typo is a room nobody can enter, reported by the channel doctor.
# - live (rooms only): a key from the registry in db/lib/roomLive.js. The
#   room's starter message gets one more line, read off live state and
#   re-rendered whenever that state moves — the Landing Pad saying whether the
#   shuttle is sitting on it. A Room's starter is otherwise written once and
#   never touched, so without this a live fact could only live on Examine, one
#   channel up from the room it is about. A key the registry does not know is a
#   sync PROBLEM, the same as an unknown attribute.
#
# PROSE STYLE — every prose value in this file is a `>-` folded block
# scalar, one physical line per paragraph, no hard wrapping, UNLESS it has
# real paragraph breaks, in which case it takes `|-` instead, with ONE blank
# line between paragraphs. An unwritten value is literally `""`.
#
# The dormant `map:` block is gone. It described the retired /map plate's four
# rhombi, and the geography it described no longer exists.
#
# HOW A LOCATION IS NAMED AND SLUGGED. Two rules, and the split is between
# built places and open country.
#
#   A BUILT place — the Keep, the Factory, the Cathedral, the Depot — takes a
#   bare slug and a bare name. There is one of each in the barony and nobody
#   says "the Fortress Keep".
#
#   OPEN COUNTRY takes its zone as a prefix: `forest-river`, `hills-ravine`,
#   `marshes-village`, `depths-runnel`. A ravine and a river are the sort of
#   thing every zone has one of, so the zone is part of the name, and the
#   Discord channel reads #hills-ravine.
#
# The wilderness used to be numbered — "Forest 7", "Depths 3" — with the
# number from Bascinet's hand-drawn map buried in the `id` and a different,
# sequential number in the `name`. Nothing lined up. The places are named
# after what is actually there now, and the drawing's number lives in
# `map_node:` where it can be read.
#
# ---------------------------------------------------------------------------
# connections: the whole travel graph. ONE entry per edge — it is undirected,
# and stating it twice is an error the parser catches. A hop between two
# Locations of the SAME zone is free, on the cooldown set on /gm/dev
# (GameConfig.locationMoveCooldownSeconds). A hop whose pair crosses into
# ANOTHER zone costs the character's Move — once a turn, twice with a mount.
# A `kind: group` zone's own id may never appear here; only its levels'
# locations are places.
#
# Two forms. A bare pair is a plain open road, which is most of the map:
#
#   - [town/square, town/cathedral]
#
# Anything else is a mapping. The keys compose, because one edge really is
# two things at once:
#
#   - pair: [fortress/gatehouse, fortress/road]
#     announce: true_name          # a MANNED gate. Posts the crosser's real
#                                  #   name into the destination zone's
#                                  #   #summary. /conceal does not help: there
#                                  #   is a Cerberus here reading papers.
#     announce: concealed          # an UNMANNED gate. Posts only what a
#                                  #   passer-by would have seen — "An old
#                                  #   woman has entered the Gate."
#     locked: <tag-slug>           # crossing needs the tag. LISTED, so a
#                                  #   player sees the door and learns what
#                                  #   opens it.
#     hidden: <tag-slug>           # crossing needs the tag AND the way is
#                                  #   absent from the travel list, so a
#                                  #   player without it never learns it is
#                                  #   there. Refuses in the same words a
#                                  #   nonexistent edge does, deliberately.
#     modular:                     # an Open/Close button on the WATCHTOWER at
#       open: true                 #   the gate. Impassable while shut. Getting
#                                  #   into the tower is the whole permission
#                                  #   model — there is no opener list, so the
#                                  #   tower's `access:` decides who may work
#                                  #   the winch. `open` is what the gate is
#                                  #   BORN as — a re-sync never reopens one
#                                  #   somebody shut in play.
#     on_foot: true                # too tight, steep or enclosed for a horse
#                                  #   or a cart. A MOUNTED character is
#                                  #   dismounted at the threshold.
#     keyed: true                  # on crossing, the KEY-HOLDER is DM'd "Leave
#                                  #   it open for the next 24 hours?". Yes and
#                                  #   the way ignores its tag and shows in
#                                  #   everyone's travel list until the window
#                                  #   lapses — which is how somebody without
#                                  #   the key follows them through. Needs a
#                                  #   locked or hidden tag to hold open.
#
# `locked` and `hidden` are the same requirement with different visibility, so
# an entry may carry one or the other, never both. Role and Tag slugs are NOT
# validated here, because tags and roles sync AFTER zones (SYNC.md's working
# order) — the same trade the room `access:` list already makes. db:doctor
# checks them instead.
# ---------------------------------------------------------------------------
zones:
  town:
    name: Town
    kind: surface
    sort: 1
    description: >-
      Ants in the marshy chaff. The town is surrounded by an old wall of ancient ceramite, so old it looks exhumed from the ground, patched by wooden palisade. Decayed electric lights illuminate the narrow streets. Speakers blare the Baron's words. It is claustrophobic — salt-of-the-earth, virtuous, and degenerate types all in one disease-ridden congregation.
    locations:
      square:
        name: Square
        # The public board (docs/systemdocs/PAPERWORK.md). The Square is where
        # everything in Town gets announced, so it is where things get nailed up.
        attributes:
          noticeboard: true
        # The cross the description promises is a real Structure, so the
        # Crucify button works here from day one.
        structures: [crucifix]
        description: >-
          An open clearing — you can actually see the sky, finally. There's a simple platform with gallows at the center. Since the inquisition's arrival, the gallows beams have come to serve the additional purpose of a crucifix. There's a stagnant pond, still and calm aside from the occasional rat seeking water. A solemn gargoyle perches on the central pillar, its eyes long dry since the waterworks broke down. Follow winding streets and alleyways to domiciles ranging from modest homes to opulent manors.
        rooms:
          square-courtyard:
            name: Courtyard
            description: >-
              A rectangular patch of salted earth. Spectator stands awaiting bloodshed surround it. Perfect place for a duel, competition or random bout of violence!
          square-market-row:
            name: Market Row
            description: >-
              Lines of stalls and tents perched against buildings. You can find all sorts of bargains here, if buying random crap is your kind of thing.
          square-smithery:
            name: Smithery
            description: >-
              The dull clanging ringing against your ears rises in intensity as you approach. Arms, armor and accoutrements are lined up behind the counter, waiting to be purchased.
          square-warehouse:
            name: Warehouse
            description: >-
              A long building storing food and other public goods.
            access: [headmans-key]
            stash:
              resources: 4
              items:
                hard-cheese: 1
                paper: 12
                hatchet: 1
          square-smithery-storeroom:
            name: Smithery Storeroom
            description: >-
              Bar iron, charcoal, and the tools too good to leave out where a customer could lift them.
            access: [smithy-key, headmans-key]
            stash:
              resources: 2
              items:
                workshop-equipment: 1
      # Promoted out of the Square, where it was a room, because the map makes
      # it a place you walk to. Its prose is unchanged.
      old-cock-inn:
        name: The Old Cock Inn
        attributes:
          haven: true
        indoors: true
        description: >-
          The coziest part of Ravenheart, open all hours of the day. It draws people from all walks of life here with the promise of hot food and liquor. Alcohol heals the soul, and will surely help you win the bar fight that is no doubt brewing.
        rooms:
          inn-street:
            name: Street
            description: >-
              The street outside the inn, where unlucky people end up. There's a porch — a fine place to smoke a cigarette.
          inn-bar:
            name: Bar
            description: >-
              Stairs lead down into the general floor. It's cozy, with a pair of braziers opposite from the entrance. There are tables, a bar, and a rage cage (the bars are electrified). Usually for cock fights, but sometimes people get in there too. The Baron mandated that his intercom be installed in here too, which sometimes kills the mood. There's also a stage for minstrels and singers.
          inn-second-floor:
            name: Second Floor
            description: >-
              Upstairs, there's a felt-padded, multipurpose game table. It's quieter here. You can look down over the railing and onto the bar. A sign says: "DENNIS'S WING"
          inn-balcony:
            name: Balcony
            description: >-
              Sometimes it's busy out here, sometimes relaxing. You can look out onto the streets.
          inn-kitchen:
            name: Kitchen
            description: >-
              Where the staff hangs out. There's a big oven.
            access: [inn-key]
          inn-cellar:
            name: Cellar
            description: >-
              A low roof; you almost hit your head. Shelves and kegs illuminated by wall candles set in a ram's horn.
            access: [inn-key]
            stash:
              resources: 3
              items:
                hard-cheese: 1
                alcohol: 1
                cigarette: 3
          inn-room-a:
            name: Room A
            description: >-
              A room to stay.
            access: [room-a-key]
          inn-room-b:
            name: Room B
            description: >-
              A room to stay.
            access: [room-b-key]
          inn-room-c:
            name: Room C
            description: >-
              A room to stay. Two beds.
            access: [room-c-key]
      # Named "Gate" in play; the id is north-gate because the Gatehouse
      # already owns "gate".
      north-gate:
        name: North Gate
        description: >-
          A gatehouse, usually unmanned, protecting the town from invaders. There's a bridge fording the small creek.
        rooms:
          north-gate-gateway:
            name: Gateway
            description: >-
              Rusted grates surround you.
          # Both town gates, the fortress and Customs all have a room named
          # "Watchtower" in play; the stem is what tells them apart.
          north-gate-watchtower:
            name: Watchtower
            access: [cerberus-key, cerberon, knighted, barons-key, hands-key, censors-key, headmans-key]
            description: >-
              Looks out onto the river. You can see the Keep up in the mountain. Has a grate you could open and throw stuff down into.
            stash: [shortbow, spear]
      cathedral:
        name: Cathedral
        indoors: true
        description: >-
          Stained limestone erected modestly upon a sedimentary-like stack of ancient buildings. Hundreds of candles light the ornate interior.
        rooms:
          cathedral-bell-tower:
            name: Bell Tower
            description: >-
              A grand, bronze bell sits up here watching over the town, waiting for a tug from below to let it sound across the land. Some vagrant has painstakingly scraped their initials into it.
          cathedral-confessionals:
            name: Confessionals
            description: >-
              Cramped and dark, the confession box was the church's primary source of information until the arrival of the inquisition and their more proactive methods. If the bishop is feeling generous, he may even take your confession free of charge.
          cathedral-order-chambers:
            name: Order Chambers
            description: >-
              The heart of the Order. There's a small room off to the side: tool racks line the walls with cruel and unusual instruments. Cages are positioned in the corners, awaiting occupants. At the center sits a chair with straps. If you tell them what they want to hear, maybe your death will be painless.
            access: [order-key]
            stash:
              items:
                paper: 12
                inquisitors-wax-stamp: 1
                torturing-equipment: 1
                bag: 1
                mace: 1
                padded-cap: 1
                crossbow: 1
                tear-gas-grenade: 3
          cathedral-hall:
            name: Hall
            description: >-
              Lines of pews illuminated by stained glass, facing an ornate altar.
          cathedral-pantry:
            name: Pantry
            description: >-
              Shelves of bread, oil, and candles.
            access: [cathedral-key]
            stash:
              resources: 3
              items:
                cooking-all-you-need-to-know: 1
          cathedral-vestry:
            name: Vestry
            description: >-
              The Chaplains and Bishop privately congregate here.
            access: [cathedral-key]
            stash:
              items:
                vestments: 2
                cross: 1
          cathedral-scriptorium:
            name: Scriptorium
            description: >-
              It's a cavern: books and tables immaculately organized, but towards the back, the stench of old books hosting colonies of mold is overwhelming. Every surface is stacked with piles of long forgotten scrawlings of past generations. Holy seals bearing quotes of scripture are stamped haphazardly.
            access: [cathedral-key]
            stash:
              items:
                paper: 20
                bishops-wax-stamp: 1
      sanctuary:
        name: Sanctuary
        attributes:
          haven: true
        indoors: true
        # It's the hospital — the operating theater standing there always did
        # (medical pass, M3). The Structure itself is Location-scoped, not
        # Room-scoped, but its narrative home is the operating theater room
        # below, which already stashes the portable surgical-equipment.
        structures: [surgical-theater]
        description: >-
          A squat but elegant place built into the ruins of an old fort. Immaculately clean, bathed by light. The Barons funded it with electrical and mechanical equipment, but not all of it works — the wooden contraptions are more reliable.
        rooms:
          sanctuary-ward:
            name: Ward
            description: >-
              A long, tiled room. There are small bedframes on either side. Potted plants offer the patients a quiet hope.
          sanctuary-esculaps-office:
            name: Esculap's Office
            description: >-
              Furnished with wood, the office stands in stark contrast to the sanitized aesthetics of the rest of the Sanctuary. Shelves on the wall are lined with glassware and bottles containing hundreds of different reagents.
            access: [sanctuary-key]
            stash:
              items:
                paper: 15
                esculaps-wax-stamp: 1
          sanctuary-operating-theater:
            name: Operating Theater
            description: >-
              A small room, windowless. A single surgery bed rests at the centre, surrounded by tables with all manner of instruments neatly arranged. An anaesthetic system is hooked up to the surgery bed, mercifully letting patients sleep through the operation. A freezer box sits in the corner awaiting generous organ donations.
            access: [sanctuary-key]
            stash: [surgical-equipment]
          sanctuary-supply-storage:
            name: Supply Storage
            description: >-
              Neatly organized shelves, labeled, archived, illuminated by standardized electric lights. Possibly the most valuable place in Ravenheart.
            access: [sanctuary-key]
            stash:
              resources: 24
              items:
                obol: 15
                cleaning-powder: 1
                surgical-equipment: 2
          sanctuary-garden:
            name: Garden
            description: >-
              A nice place to sit and think.
      underquarter:
        name: Underquarter
        description: >-
          Squat buildings, piled into discomfort.
        # Not rich ground — a scrounge through scrap shacks and a gambling
        # den's spare change, not a dig site (Bascinet, 2026-09-10).
        yield: { prospecting: 0.4 }
        rooms:
          underquarter-shacks:
            name: Shacks
            description: >-
              These crudely constructed dwellings — scrap metal, wood — were never designed to last, and yet here they remain. Very few have proper owners, even fewer have working locks. An endless cycle of vagrants staking claim to an empty shack, before being turfed off by another. There are old abandoned lots too, dozens of empty buildings without purpose.
          underquarter-abandoned-theater:
            name: Abandoned Theater
            description: >-
              Once a bustling center of culture, this place now serves as a home for an ever-growing population of the destitute. A side room functions as a gambling den. Neon lights soak the interior, illuminating the felted gambling tables. There is a counter at the far end of the room with a bell waiting for patrons to ring it and have their worldly desires fulfilled.
          underquarter-bathhouse:
            name: Bathhouse
            description: >-
              One of the newer parts of the town, the bath house offers a central communal bath. The water is off-color — it doesn't smell good. Alternatively, paid showers line the walls, providing fresh clean water in return for a coin inserted into a slot.
          underquarter-alleyways:
            name: Alleyways
            description: >-
              It's dark and dirty in here.
          underquarter-sewers:
            name: Sewers
            description: >-
              Automated machineries used to provide plumbing, but now it's still and dirty. The sewer grate is locked.
            access: [sewer, tunnel-rat, sewer-key]
            stash:
              items:
                feces: 6
          underquarter-basements:
            name: Basements
            description: >-
              Four connected basements, their separating walls knocked down. Originally some sort of hidden den, this now is a perfect place for organizing. It's accessed through the sewers.
            access: [underquarter-basements, thanati, thanati-leader]
            stash:
              resources: 8
              items:
                sewer-key: 1
                elevator-key: 1
                obol: 4
                dagger: 4
                fine-meal: 1
                black-robes: 1
                paper: 19
          underquarter-pushers-room:
            name: Pusher's Room
            description: >-
              A den to conduct shady deals, lit by neon. Connected to the Abandoned Theater.
            access: [pushers-key]
          underquarter-organ-shop:
            name: Organ Shop
            description: >-
              A dark room below street level with a crude operating table. A small window near the roof lets in some of the street's light.
            access: [tunnel-rat]
            stash:
              items:
                cleaning-powder: 1
                obol: 12
      south-gate:
        name: South Gate
        description: >-
          A gatehouse, usually unmanned, protecting the town from invaders. There's a bridge fording the small creek.
        rooms:
          south-gate-gateway:
            name: Gateway
            description: >-
              The most traveled gate. Tired horses draw half-full wagons.
          south-gate-watchtower:
            name: Watchtower
            access: [cerberus-key, cerberon, knighted, barons-key, hands-key, censors-key, headmans-key]
            description: >-
              Looks out onto the river. You can see the Keep up in the mountain. Has a grate you could open and throw stuff down into.
            stash: [buckler, broadsword, obol]

  fortress:
    name: Fortress
    kind: surface
    sort: 2
    description: |-
      The fortress and its small surrounding estates rise nobly from the wooded hills, the keep itself visible behind the walls. They look down upon the town. A stone bridge fords the river.

      The Lifeweb emits primordial green fires.
    locations:
      gatehouse:
        name: Gatehouse
        attributes:
          noticeboard: true
        description: |-
          Grass rises rebelliously around the manicured paths, illuminated by searchlight. Past the portcullis, old stone stairs rise towards the Keep, and further yet, to the Lifeweb tower. The Gatehouse itself has several watchtowers and a murder hole over the gate. A winch system controls the portcullis.

          There is a triple-barreled machinegun in the center of the yard, on a rotor. It seems to be off.
        rooms:
          gatehouse-gate:
            name: Gate
            description: >-
              Menacing iron, with several inset windows, built by a paranoid man. There are old logs to the side, piled and bound.
          gatehouse-yard:
            name: Yard
            description: >-
              The constant rains have raised vines across the fortress walls, which flower white and pink.
          # `fortress-watchtower`, not `watchtower` — Customs holds that slug,
          # and the two town gates hold the other obvious ones. It is named
          # "Watchtower" in play like all four.
          #
          # The portcullis winch is worked from HERE, not from the Gatehouse
          # anchor and not from the Road: db/lib/roomStarterRow.js puts the
          # gate button on this room's starter. Hence the access list: getting
          # in here IS the authority to work the winch, so it is the only
          # answer to "who may shut the gate".
          gatehouse-watchtower:
            name: Watchtower
            access: [cerberus-key, cerberon, knighted, barons-key, hands-key, censors-key]
            description: >-
              A pair of thin, menacing watchtowers lined with spikes and draped with the Raven banner.
      # Promoted out of the Gatehouse, where it was a room. On Bascinet's map
      # this is the node drawn as "Gardens". Its prose is unchanged.
      lifeweb:
        name: Lifeweb
        description: >-
          A tower of pure ceramite looms before you. Its peak crowned with vibrant flame. The Mortii's key unlocks the door.
        attributes:
          noBuild: true
        rooms:
          lifeweb-outside:
            name: Outside
            description: >-
              The door to the Lifeweb is in front of you. The grass is especially alive here.
          lifeweb-inner:
            name: Inner Lifeweb
            access: [mortus-key]
            description: >-
              Pistons and machinery connect to pumps and tubes, all terminating in the chair in the center of the room. Strap someone in, adjust the ventricles, prepare the injection site, and decide whether to drain them fully or leave them alive. Sealed hatches lead into maintenance tunnels.
          lifeweb-mortus-shacks:
            name: Mortus Shacks
            access: [mortus-key]
            description: >-
              Tucked into the wall. The Baron tolerates their presence, as pitiful as they are.
            stash:
              items:
                obol: 1
                paper: 4
                hatchet: 1
                cudgel: 1
                mortus-rags: 1
                mortus-key: 1
      servant-wing:
        name: Servant Wing
        description: >-
          Steam puffs from the electric heatvents, choking the tight passages. Kitchens and other rooms provide a respite where the servants gather to work. Their quarters are just closets with stacked cots.
        rooms:
          servants-storehouse:
            name: Storehouse
            description: >-
              A larder and a cellar combined in one, holding the keep's goods.
            stash:
              resources: 3
              items:
                fine-meal: 1
                paper: 5
                meisters-wax-stamp: 1
          servants-quarters:
            name: Servant's Quarters
            access: [servant, barons-key, hands-key]
            description: >-
              Bunks, a stove and a long table, all of it worn smooth. The one room in the Keep the nobility has no reason to enter.
          # `fortress-kitchen`, not `kitchen` — the Old Cock Inn holds that slug.
          servants-kitchen:
            name: Kitchen
            description: >-
              An industrial operation, with racks of ovens, a heavy granite table, and thick cleavers.
            stash: [work-knife]
          servants-workshop:
            name: Workshop
            description: >-
              A place to sew, do laundry, and build simple things.
            stash: [workshop-equipment]
          # The second `destroys` room in the game, after the Factory's
          # Spillway. See docs/systemdocs/CARRY.md.
          servants-latrines:
            name: Latrines
            description: >-
              A chute into the darkness. Anything stored here is lost permanently.
            destroys: true
      keep:
        name: Keep
        attributes:
          haven: true
        indoors: true
        description: |-
          Stone walls reinforced with ceramite, the color of terracotta and steel, draped with the Baron's fluttering heraldry. Old electric lamps of various colors illuminate the warm, comfortable interiors.

          The gates open into a hallway branching into the Keep's many rooms. Past gargoyle-studded columns, the throne room. Stairs lead downwards into the Undercroft and upwards into the Quarters.
        yield: { farming: 0.2 }
        rooms:
          keep-throne-room:
            name: Throne Room
            description: |-
              Intimately small, with an ornately carved wooden throne. The floor is uniformly tiled with ceramite bricks aside from a trapdoor directly in front of the throne. Benches form concentric circles near the entrance. There's an elevated arcade to the left, and a hearth to the right.

              There's a trapdoor in the center. You can hear something rumbling in the darkness.
          keep-great-hall:
            name: Great Hall
            description: >-
              The roof vaults over rows of banqueted tables. There's a balcony; the view plunges downwards into the forest. There is a huge painting of Baron Casimir the Great.
          keep-nook:
            name: Nook
            access: [behind-the-painting]
            description: >-
              An empty room. It has unfinished sketches of a nude man in various poses across the walls.
          keep-council-room:
            name: Council Room
            access: [barons-key, hands-key, meisters-key, censors-key]
            description: >-
              A wide table. There's a holographic map of Ravenheart and a button for the intercom.
            stash:
              items:
                paper: 4
          keep-swimming-pool:
            name: Swimming Pool
            description: >-
              An extravagant design. Its novelty has worn off, and now it's a place where the nobility fall in and drown. You swear you can see something shiny at the bottom.
          keep-library:
            name: Library
            description: >-
              Rows upon rows of bookcases, most of which lie empty. Various offices of members of the court branch off from here.
            stash:
              items:
                paper: 23
                the-wise-plague-doctor: 1
                caspians-diary: 1
                100-years-of-solitude: 1
                the-art-of-war: 1
                flatbreads-sweet-breads-and-red-breads: 1
                pancakes-cupcakes-and-cake-cakes: 1
                pastrys-crumblys-and-pies: 1
                the-bird: 1
                nillum: 1
                amour-et-socialisme-translated: 1
                a-murmur-darkly-last-call: 1
                a-murmur-darkly-aches-and-pains: 1
                10001-things-to-do-with-your-pet-rat: 1
                magical-code-of-regulations-part-xxxii: 1
                sword-in-high-heavens: 1
                prophecies-of-sir-thomast: 1
                basic-strategy: 1
          # Was one "Noble Chambers". Three rooms now, each with its own key —
          # and the Baron's opens all three, which is rather the point of being
          # the Baron. The Baroness's key opens his chambers alone.
          keep-barons-chambers:
            name: Baron's Chambers
            access: [barons-key, baroness-key]
            description: >-
              The Baron's room opens into a large, ornately decorated bedroom with a stunningly comfortable bed at the center. A wardrobe built into the wall contains all manner of fine attire for both the Baron and Baroness.
            stash:
              items:
                obol: 19
                paper: 2
                dagger: 1
          keep-heirs-chamber:
            name: Heir's Chamber
            access: [heirs-key, barons-key]
            description: >-
              Small and austere, with a map.
            stash:
              items:
                obol: 2
                broadsword: 1
          keep-successors-chamber:
            name: Successor's Chamber
            access: [successors-key, barons-key]
            description: >-
              A dresser and a mirror to allay her vanity.
            stash:
              items:
                obol: 1
                tea: 1
                love-lies-and-lays-of-larry-luca-life-1-royal-loyal-lynn: 1
          keep-terrace:
            name: Terrace
            description: >-
              A sprawling terrace with herbs, flowers, and even a mini-hedge maze. The perfect place for a nighttime party.
          keep-meisters-office:
            name: Meister's Office
            access: [meisters-key, barons-key]
            description: >-
              A narrow office.
            stash:
              items:
                paper: 25
                states-of-matter: 1
          keep-hands-office:
            name: Hand's Office
            access: [hands-key, barons-key]
            description: >-
              A narrow office.
            stash:
              items:
                paper: 7
                cleaning-powder: 1
                hands-wax-stamp: 1
          # The far end of the throne room's trapdoor. `in-the-pit` is GM-given
          # on the way down, which is the only way anybody arrives.
          keep-graga-pit:
            name: Graga Pit
            access: [in-the-pit]
            description: >-
              Wet stone, a long way down, and something breathing in the dark that is much larger than you are.
          keep-the-charon:
            name: The Charon
            description: >-
              A sealed gate. The Baron's key opens this.
            access: [barons-key]
          keep-reliquary-chapel:
            name: Reliquary Chapel
            description: >-
              Courtiers come here to pray. The Silver Cross of Ravenheart is locked away behind the altar, accessible by the Incarn's key.
          keep-cross-room:
            name: Cross Room
            access: [incarns-key]
            description: >-
              Behind the chapel, the cross itself is stored in an ornate altar.
            stash: [silver-cross]
          keep-barons-study:
            name: Baron's Study
            description: >-
              Scrolls, books, and the elegant skeleton of a cave beast. A balcony looks out onto Ravenheart.
            access: [barons-key]
            stash:
              items:
                armory-key: 1
                elevator-key: 1
                paper: 20
                barons-wax-stamp: 1
      garrison:
        name: Garrison
        attributes:
          noticeboard: true
        description: >-
          The garrison tower and its offshoot buildings surround the training yard. A home for those who walk the cobbles at night.
        rooms:
          # The counter you talk to the garrison across. The only room here
          # anybody may simply walk into — everything past it is Cerberon.
          garrison-entrance:
            name: Entrance
            description: >-
              A wolf's head hangs over the counter, which is separated from the room by metal bars. There's a bust of a former baron.
          garrison-censors-office:
            name: Censor's Office
            access: [censors-key, cerberus-key]
            description: >-
              The Censor's office is spacious, with a small portrait of his beloved Baron perched on the wall. A caged window looks out over the training ground below. There is a big red button on the wall.
            stash:
              items:
                paper: 8
                censors-wax-stamp: 1
                cerberus-key: 3
          garrison-barracks:
            name: Barracks
            access: [cerberus-key]
            description: >-
              Rows of bunks stand at attention. All but a handful are orderly and unused, might be a sign it's time to find some new recruits.
          # No door, deliberately. This is the Cerberon's silo, and a public
          # silo is the authored default (FACTIONS.md 4) — a faction that wants
          # a door moves its silo behind one. Locking it would also hand every
          # accepted Cerberon invite a cerberus-key through siloKeySlugs, and
          # that key works every gate in the game.
          garrison-mess-hall:
            name: Mess Hall
            description: >-
              The Cerberon's few goods are stored here. There are tables, a bar, and a window looking into the courtyard.
            stash:
              resources: 2
              items:
                alcohol: 1
          garrison-armory:
            name: Armory
            description: >-
              Gargoyles flank a statue of the good Baron Casimir the Great. Halberds, shields mounted on the walls, and a single electric chandelier hanging from the rafters.
            access: [armory-key]
            stash:
              items:
                radio-bracelet-cerberon: 3
                truncheon: 4
                halberd: 2
                broadsword: 1
                gladius: 2
                mace: 3
                dagger: 2
                spear: 3
                buckler: 4
                shield: 3
                longbow: 2
                breastplate: 2
                simple-helm: 4
                cerberus-helmet: 4
                mail-coif: 3
                mail-shirt: 4
                padded-armor: 5
                padded-cap: 3
          garrison-dungeons:
            name: Dungeons
            access: [censors-key, incarns-key, cerberus-key]
            description: >-
              Rows of cells behind iron bars, each with a lock only accessible by members of the garrison.
          garrison-oubliette:
            name: Oubliette
            access: [censors-key, incarns-key, cerberus-key]
            description: >-
              If you throw a man in here, they're not getting out.
          garrison-training-yard:
            name: Training Yard
            access: [cerberus-key]
            description: >-
              In the garrison's central courtyard, surrounded by elevated platforms, a patch of packed earth serves as a sparring ground for recruits and veterans alike. There is a box of wooden training weapons.
          garrison-stables:
            name: Stables
            access: [cerberus-key]
            description: >-
              A small stable. Most of the pens are empty. Those that aren't have old horses, lame and unable to bear the weight of a human. Good and mean dogs both are caged along the back wall, ready to hunt unruly peasants.
            stash:
              items:
                hound: 2
                horse: 1
                plow: 1
      undercroft:
        name: Undercroft
        indoors: true
        description: >-
          Pillars uphold the keep from collapsing onto the barrels of wine and antiquities. There are deeper passages.
        # Not rich ground — old coin and a shrine's own offerings, not the
        # Vault down the hall (Bascinet, 2026-09-10).
        yield: { prospecting: 0.4 }
        rooms:
          undercroft-sauna:
            name: Sauna
            description: >-
              A bath and a sauna. The Baron's preferred way to wash. The water is kept at a comfortably warm temperature, and is actually changed, unlike the public bathhouse.
          undercroft-cistern:
            name: Cistern
            description: >-
              Dark, connected rooms with ornate pillars, full of knee-high water. A starry tile mosaic is visible beneath the water.
          undercroft-tombs:
            name: Tombs
            description: >-
              The Baron's progenitors bear faces of varying humanity.
          undercroft-bricked-up-door:
            name: Bricked-up Door
            description: >-
              Where does this go…? It wouldn't be easy to open this passageway.
          undercroft-ancient-shrine:
            name: Ancient Shrine
            description: >-
              A shrine to Thoth, the Old God of art, magnificence, and inspiration. How has this not been destroyed yet?
          # The near end of the Baron's lift. The edge itself is
          # `hidden: elevator-key` in `connections:`; this is the cage.
          undercroft-elevator-room:
            name: Elevator Room
            access: [elevator-key]
            description: >-
              A cage suspended over the darkness. Use the pressure plate to descend.
          undercroft-vault:
            name: Vault
            access: [barons-key]
            description: >-
              A hydraulically-operated electric vault door seals off a deep room.
            stash:
              resources: 14
              items:
                obol: 15
                painting: 1
                nuclear-device: 1
      road:
        name: Road
        map_node: 11
        description: >-
          Green hills and a long white road, sinuous as a snake: grasshoppers buzz in the daisies. The Gatehouse bristles with Cerberi.
        rooms:
          road-stretch:
            name: Road
            description: >-
              Just a little ways longer.
          road-shrine:
            name: Shrine
            description: >-
              A mossy shrine erected to honor a forgotten saint. Its cloaked statue, bolted to a pedestal, is the size of a doll. Its face was marred by vandals.
          # The same tag that locks the climb down to the Hills in
          # `connections:` — one skill, one kind of ground.
          road-ledge:
            name: Ledge
            access: [mountaineering]
            description: >-
              There's a drop off, stopped by a ledge. The sure-footed and careful can pick their way down and crouch in the shade of a wizened, nigh-horizontal oak tree.
      manors:
        name: Manors
        description: >-
          Homes surrounded by high stone walls, overgrown with flowers, with a nice gateway and ornate galleries. There's a deconstructed machine gun nest on one of the semicircle balconies, no longer functional.
        yield: { farming: 0.6 }
        rooms:
          manors-road:
            name: Road
            description: >-
              Halfway up the hill.
          # What `manor-key` has been for since it was written. Until now it
          # opened nothing.
          manors-manor:
            name: Manor
            access: [manor-key]
            description: >-
              The landscaping is incomplete, with grasses growing through the stones. However, the interior is well kept, with an old rug, a wine cabinet, and a hearth.
            stash:
              items:
                paper: 23
                ravenheart-red: 1
                instrument: 1
                sabre: 1
          manors-cellar:
            name: Cellar
            access: [manor-key]
            description: >-
              Damp and dark.
            stash:
              items:
                obol: 4
                cave-fungus: 1
          manors-garden:
            name: Garden
            access: [manor-key]
            description: >-
              A walled garden for growing herbs.

  forest:
    name: Forest
    kind: surface
    sort: 3
    description: >-
      Streams part mossy boulders under the green shadows of spruce and beech. The rustling of leaves in the wind is occasionally interjected by the sounds of things moving in the undergrowth. There are marshes, creeks, and bountiful visages. The trees thin on their approach to the mountains.
    locations:
      # Prospecting joined the Forest 2026-09-09 (LABORING.md §3a) — it isn't
      # only mining (the Caves/Depths flavor above): a stream is panned, a
      # ruin is scavenged, the undergrowth is foraged. Eight of the twelve
      # locations got a row, each for something already in its own
      # description — a stream, a wreck, a fungal floor — not blanket-added.
      forest-headwaters:
        name: Headwaters
        attributes:
          wilderness: true
        map_node: 1
        description: >-
          The trees thin, giving way to tough grass, slippery granite, and cold streams. A purple haze hangs over the rocky, inhospitable soil, but water gathers in root-webbed pockets between boulders—before disappearing under loose stone and surfacing again farther downhill. A rattling mountain wind moves freely through the gaps in the sinewy canopy, carrying spray from the falls and the constant rattle of shifting scree. Scrabbling up the mossy rocks would be difficult.
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.9, prospecting: 0.5 }
        rooms:
          headwaters-gravel-field:
            name: Gravel Field
            description: >-
              A broad spill of loose stone slopes beneath the cliffs, every step sending pebbles whispering downhill. Ash blown from distant lands settles on the hardy grass, almost burying the flesh-colored mountain flowers that survive between the rocks.
            stash:
              items:
                rock: 1
          headwaters-basins:
            name: Basins
            description: >-
              A narrow waterfall plunges into deep, cold pools. You can't see the bottom. The waterfall obscures a small network of caverns. Stacked stones are all that remain of an ancient bathhouse.
          # The old Cave room's stash, kept intact under the room that replaced it.
          headwaters-lower-baths:
            name: Lower Baths
            description: >-
              A cracked stairwell beneath the warmest basin descends into chambers preserved beneath the ruins, where clear water still passes through carved channels in the stone. Mineral deposits cover an old doorway.
            access: [caving]
            stash:
              items:
                obol: 32
                gladius: 1
                advanced-poppy: 1
                gladiator-helmet: 1
      forest-cliffs:
        name: Cliffs
        attributes:
          wilderness: true
        map_node: 2
        description: >-
          Granite walls rise abruptly among the trees, their faces striped with runoff and pale colonies of lichen. Blue pine grows wherever roots can find purchase, sometimes jutting sideways from cracks high above the forest floor. The ground is divided into shelves, narrow gullies, and sudden drops that make even nearby places awkward to reach. Dark fissures appear between roots and fallen stone, some ending after a few feet and others breathing cold air from somewhere deeper.
        yield: { hunting: 0.5, farming: 0.3 }
        rooms:
          cliffs-path:
            name: Cliffside Path
            description: >-
              A dirt trail hugs the base of the cliffs beneath a large boulder shaped vaguely like a weathered head. Behind it, several narrow openings lead into darkness where the mountain has split apart.
          cliffs-den:
            name: Den
            description: >-
              A low cave smells strongly of damp fur, old blood, and wet leaves. Bones have been pushed toward the edges while a bed of grass and shredded bark occupies the driest corner.
            access: [forester]
          cliffs-elevator:
            name: Elevator
            # The near end of the Baron's lift, whose edge out of
            # fortress/undercroft is `hidden: elevator-key` in `connections:`.
            description: >-
              Beyond one of the deeper fissures, natural stone abruptly gives way to an iron cage suspended inside a perfectly vertical shaft. A rusted winch sits beside it, its cables disappearing upward farther than torchlight can reach.
            access: [elevator-key]
      forest-creekside:
        name: Creekside
        attributes:
          wilderness: true
        map_node: 3
        description: >-
          A creek runs through a ditch, tearing through the purple floor-carpet of mushrooms and decomposing material beneath scraggly trees, slipping around boulders and roots before gathering briefly in quieter pools. Ferns crowd the banks and low branches hang almost to the surface, turning the water silver-green beneath the leaves. An old trail follows the stream where the ground allows it, repeatedly vanishing beneath moss or storm-fallen timber. Farther along, the forest has grown almost completely around the remains of an old station.
        # Best Prospecting in the Forest, tied with East River — the mushroom
        # colonies and the old pans already sitting in the Waystation's stash
        # (below) made this the clearest case for it.
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.9, prospecting: 1.0 }
        rooms:
          creekside-split-rock:
            name: Split Rock
            description: >-
              A great moss-covered boulder divides the creek neatly in two, forcing the water around either side in narrow rushing channels. Its flattened crown rises above the undergrowth and offers a rare view along the stream. Thousands of pounds of mushroom colonies cling onto its base.
          creekside-waystation:
            name: Waystation
            description: |-
              The purpose of the decrepit, mossy wood is hard to discern. The frontmost room is collapsed, and ancient swords are stabbed into the ground, one of their owners now a desiccated corpse.

              The main chamber has old pans and tools, and a mangled pitchfork. Light enters through the decayed roof.
            stash:
              resources: 1
              items:
                hatchet: 1
                paper: 1
          creekside-supply-room:
            name: Supply Room
            description: >-
              A reinforced inner door guards the only part of the lodge that remained reliably dry. Behind it, dusty shelves still hold tools, wrapped bundles, and supplies protected from decades of rain.
            access: [foresters-key]
            stash:
              items:
                supply-kit: 2
          creekside-root-cellar:
            name: Root Cellar
            description: >-
              A mat of ivy conceals a low wooden hatch pressed between two roots behind the lodge. Cold stone steps descend to shelves of empty jars and a narrow drainage channel where water quietly disappears beneath the wall.
            access: [forester]
            stash:
              items:
                foresters-key: 1
      forest-northern-road:
        name: Northern Road
        attributes:
          wilderness: true
        map_node: 4
        description: >-
          The road climbs towards the Fortress in long switchbacks cut into the wooded hillside. Rough stone steps reinforce the steepest stretches while old retaining walls bulge beneath roots that have slowly forced their way through the masonry. The canopy occasionally opens without warning, revealing the Town below before closing around the road again. Weather and traffic have worn the route deeply into the mountain.
        yield: { hunting: 0.5, farming: 0.5, fishing: 0.9 }
        rooms:
          northern-road-ascent:
            name: Ascent
            description: >-
              A sun-bleached Ravenheart banner hangs from a post overlooking one of the sharper turns, surrounded by old swords stabbed into the ground. An old wagon lies toppled and broken, the wood warped. From here, the river catches the light far beneath the trees and rooftops appear small enough to cover with a hand.
          northern-road-shrine:
            name: Wayside Shrine
            description: >-
              A shallow stone niche has been cut into the uphill bank around the worn figure of an unnamed saint. Coins, dried flowers, ribbons, and little personal objects collected beneath it.
            stash:
              items:
                old-coin: 3
                obol: 1
      forest-west-riverbank:
        name: West Riverbank
        attributes:
          wilderness: true
        map_node: 5
        description: >-
          The creek widens here into a slow, black river beneath trees whose roots knot through the banks like exposed fingers. Old docks lean over the water at uneven angles, some ending abruptly where whole sections have rotted away, while fishing line and scraps of cloth sway from branches overhead. The current is too sluggish to hear.
        yield: { hunting: 0.8, farming: 0.3, prospecting: 0.4 }
        rooms:
          riverbank-large-dock:
            name: Large Dock
            description: >-
              A broad timber dock reaches far over the dark water, its outer posts disappearing somewhere beneath the surface.
          riverbank-banks:
            name: River Banks
            description: >-
              The banks descended through mud and exposed roots into warm, shallow water. Scratches and footprints gather along the shore.
      forest-deep-forest:
        name: Deep Forest
        attributes:
          wilderness: true
        map_node: 6
        description: >-
          The trees gather so tightly here that daylight reaches the ground only in thin green shafts, leaving the undergrowth drowned in perpetual dusk. Thorn, fern, and hanging moss choke the spaces between trunks, while old paths wander into dead ends or circle back upon themselves without obvious reason. There are small bioluminescent flowers to guide the way. Strange little remnants appear beneath the leaves: worked stones, rotted fence posts, fragments of walls.
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.9, prospecting: 0.5 }
        rooms:
          deep-forest-brambles:
            name: Brambles
            description: >-
              Thorny growth closes over the forest until there is scarcely enough room to squeeze between trunks. Old strips of cloth hang from the briars at shoulder height, snagged there by travelers who continued deeper.
          deep-forest-clearing:
            name: Clearing
            description: >-
              A large fallen tree has dragged several others down with it, opening a patch of soft grass beneath the otherwise unbroken canopy. The surrounding trees lean inward around the clearing. There's a clear shaft of warm sunlight, and a few birds are chirping.
            access: [forester]
          deep-forest-sylvan-shrine:
            name: Sylvan Shrine
            # TODO: a "Pray" button here should strip a character's belief tags
            # and grant old-ways-sylvia, unless they hold `fundamentalist`. A
            # Room carries no `attributes:` — only a Location does — so there
            # is nowhere in this file to hang it. Needs its own piece of work.
            description: >-
              Deep between the trees stands a broken sculpture of antlers, weathered until it is difficult to tell whether it was carved from stone or bone. Small offerings lie beneath it in varying states of decay.
            access: [old-ways-sylvia, forester]
            stash:
              items:
                honey: 1
      forest-riverbend:
        name: Riverbend
        attributes:
          wilderness: true
        map_node: 7
        description: >-
          The river turns sharply through a stretch of woodland broken by storms, where dead trees lie piled against one another in pale heaps and enormous root plates rise from the mud like walls. Pools of brown, decayed sludge fill the holes they left behind, deep enough in places that their bottoms cannot be seen. Beyond the bank, an old ravine cuts into the hillside beneath leaning timber and remnants of collapsed workings.
        yield: { hunting: 0.5, farming: 0.3, prospecting: 0.5 }
        rooms:
          riverbend-river-bank:
            name: River Bank
            description: >-
              The remains of an old path follow the river between heaps of deadfall, appearing only where plenty of leaves have failed to cover its stones. Several trees beside it bear shallow cuts at roughly head height, continuing toward the cliffs until the trail vanishes completely.
          riverbend-ravine:
            name: Ravine
            description: >-
              A steep muddy ravine opens beneath the trees, littered with rain-filled pits and splintered timber. At its far end, rotten beams brace a collapsed mineshaft whose entrance has been sealed beneath tons of stone.
            access: [mountaineering]
            stash:
              items:
                plow: 1
      forest-south:
        name: South Forest
        attributes:
          wilderness: true
        map_node: 8
        description: >-
          Four roads meet beneath a sparse opening in the canopy where generations of travelers have worn the earth bare. Old signs, nailed boards, and crude charms crowd the trees. Two husked, purple bodies still hang beside the junction, turning slowly whenever enough wind reaches them. What you can see of the sky is thick, purple, and grave.
        yield: { hunting: 0.5, farming: 0.5 }
        # The two men in the description hang from this.
        structures: [crucifix]
        rooms:
          south-crossroads:
            name: Crossroads
            description: >-
              People pass frequently through here, avoiding each other's glances.
      forest-sparse-field:
        name: Sparse Field
        attributes:
          wilderness: true
        map_node: 9
        description: >-
          The forest gives way abruptly to an open waste of mud, stumps, and gray grass beneath the oppressive sky. Rotting timber, abandoned carts and rusted equipment lie scattered across the clearing. At its center sprawls an overgrown prison complex, its walls and watchtowers sinking slowly beneath vines, moss, and years of neglect.
        # An abandoned prison's worth of scrap and rusted equipment scattered
        # across the field — as good a scavenging ground as the Forest has.
        yield: { hunting: 0.5, farming: 0.5, prospecting: 1.0 }
        rooms:
          sparse-field-lumber-field:
            name: Lumber Field
            description: >-
              Rows of felled trunks lie half-sunk in the mud, many left where they fell when the work crews abandoned the clearing. Rusted saws and broken hauling chains disappear beneath the grass, while the remaining stumps have begun sprouting pale fungi from their cut faces.
          sparse-field-cellblock:
            name: Cellblock
            description: >-
              Rows of narrow cells face a central corridor. Pale mycelium has overtaken the gaps in the rock, creating a superorganism. Several cells contain bodies dried against bunks or walls. The floors are metallic and grated, the same rusted ceramite featured in the Keep.
          sparse-field-office:
            name: Office
            description: >-
              Broad windows overlook both the yard and work fields. A blackened ring of prison keys hangs behind the desk beneath a wall where somebody drove a blade directly through an old map of the forest.
          # Drafted as a second room called "Office". Renamed so the two are
          # tellable apart in a travel list; the prose is untouched.
          sparse-field-property:
            name: Property Room
            description: >-
              Numbered shelves contain the property taken from Graywall's prisoners: boots, knives, jewelry, and letters.
            access: [graywall-key]
            stash:
              items:
                jewelry: 2
                trench-knife: 1
                work-knife: 2
                paper: 13
                bannerets-wax-stamp: 1
                obol: 6
                brigandine: 1
                supply-kit: 1
          sparse-field-outcrop:
            name: Outcrop
            description: >-
              A cluster of granite boulders rises sharply above the stripped field, providing an uninterrupted view across Graywall, the old logging grounds, and the forest beyond. From this height, narrow trails and breaks in the distant treeline become visible that cannot be seen from below.
            access: [mountaineering]
            stash:
              items:
                graywall-key: 1
      forest-embankment:
        name: Embankment
        attributes:
          wilderness: true
        map_node: 10
        description: >-
          The road narrows where the river presses against a steep, root-bound embankment, leaving scarcely enough room for carts to pass abreast. Old masonry emerges from beneath the soil here, stained black by moisture and disappearing beneath trees that have grown directly through it. Water trickles continuously from somewhere inside the bank, carrying leaves, rust, and occasional scraps of refuse toward the river. Even in daylight, the culvert beyond remains dark enough that its far end cannot be seen.
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.9, prospecting: 0.4 }
        rooms:
          embankment-road:
            name: Road
            description: >-
              The roadway is squeezed tightly between the river and the wooded rise, with dense brush overlooking both approaches. There is little room to leave it without climbing the bank or entering the water.
          embankment-culvert-gate:
            name: Culvert Gate
            description: >-
              A heavy iron grate seals a low stone passage beneath the embankment, its bars half-consumed by roots and rust. Water slips beneath it from somewhere deeper inside, and old scratches score the masonry immediately beyond the gate as though something heavy had repeatedly been dragged through.
            access: [sewer-key]
            stash:
              items:
                feces: 3
      forest-east-river:
        name: East River
        attributes:
          wilderness: true
        map_node: 36
        description: >-
          The river forces its way through a steep canyon where dead trees cling to the slopes above black water. Ruined masonry, rusted weapons, and pieces of worked metal frequently wash from upstream and lodge between the rocks.
        # Best Prospecting in the Forest, tied with Creekside — its own
        # description already says worked metal washes up and lodges here.
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.9, prospecting: 1.0 }
        rooms:
          east-river-bridge:
            name: Bridge
            description: >-
              A weathered wooden bridge spans the canyon where the banks briefly draw close, its supports wedged between old stone foundations much older than the timber above them.
          east-river-washup:
            name: Rockside Washup
            description: >-
              Accessible by boat, there's a still pond on the side of the river where some of the town's washup has collected.
            access: [fishing-boat]
            stash:
              items:
                sewer-key: 1
                obol: 3
                skinned-cave-rat: 1
                feces: 4
                alcohol: 3
                crate-rv-6207-m: 1
                a-murmur-darkly-a-shot-in-the-dark: 1
      farms:
        name: Farms
        description: >-
          Smoke rises from thatch-roofed houses on the other side of the river from the town. They're slightly elevated, just above the cattails, but still vulnerable. There's a small guard tower.
        yield: { farming: 1.0 }
        rooms:
          farms-fields:
            name: Fields
            description: >-
              Low walls of piled rocks separate the road from expansive fields of wheat. There's carts and empty crates, used for the harvest.
            stash:
              items:
                pitchfork: 4
                work-knife: 1
          farms-village-green:
            name: Village Green
            description: >-
              Several plum trees surround a large, dead oak. The hamlet's informal gathering place.
          farms-old-church:
            name: Old Church
            description: >-
              A miniature stone church with a cross inside. There's a cart laid on its side.

  hills:
    name: Black Hills
    kind: surface
    sort: 4
    description: >-
      Ancient buildings layer atop craggy, mossy rocks. You can see the rest of the barony between the branches of the leafless trees.
    locations:
      # Prospecting joined the Black Hills 2026-09-09 (LABORING.md §3a), same
      # as the Forest — eight of the nine locations got a row, each for
      # something already in its own description. hills-mountain is the one
      # left off: it already has no yield rows at all (a pass, not worked
      # ground). hills-west (below) turned out the opposite of a skip — a
      # real grave under its own gallows made a genuinely unique prospecting
      # site, its own drop table and all (Bascinet's call, 2026-09-09).
      #
      # Both ways in are `locked: mountaineering` in `connections:`, so the
      # pass gates itself — a Location wears no `access:` list of its own.
      hills-mountain:
        name: Mountain
        attributes:
          wilderness: true
        indoors: true
        description: |-
          The mountain rises so far above Ravenheart that the forests below eventually dissolve into a dark blue haze, and even the fortress seems reduced to something small enough to cup in one hand. The pass claws its way over the exposed peak by means of cut stone steps, narrow ledges, and lengths of fixed rope strung across places where there is simply no proper footing at all. Wind tears constantly across the heights, carrying ice, grit, and cloud through gaps in the rock while whole valleys appear and disappear beneath passing sheets of mist.

          From the summit, the western woods and the fortress can both be seen at once, divided by an immense sweep of country that finally makes the barony feel as expansive as it truly is.
        rooms:
          mountain-hanging-steps:
            name: Hanging Steps
            description: >-
              Rough stairs have been cut directly into the mountainside where the path becomes too steep to climb naturally. In several places the steps simply stop, replaced by old fixed ropes and iron spikes hammered into the rock above a drop too deep to judge from the ledge.
            stash:
              items:
                rock: 1
          mountain-summit:
            name: Summit
            description: >-
              Offerings, broken tools, old coins, ribbons, and scraps of cloth have been wedged between the rocks, all bleached pale by the sun and wind.
            stash:
              items:
                old-coin: 9
                work-knife: 1
                supply-kit: 1
          # The three plant forageables BREWING.md §4 lists as having nothing
          # that drops them yet. A warm spring under the ice is where they grow.
          mountain-garden:
            name: Garden
            description: >-
              A warm cavern opens unexpectedly around a spring, filled with pale ferns, luminous moss, and tiny white flowers growing beneath shafts of light that descend through cracks far overhead. The air is humid and still, carrying the smell of wet earth in stark contrast to the freezing mountain outside.
            access: [caving]
            stash:
              items:
                nightshade-herb: 2
                poppy-pods: 2
                coca-leaves: 2

      hills-underlocks:
        name: Underlocks
        attributes:
          wilderness: true
        map_node: 12
        description: >-
          The path twists and turns around the terrain. You can see Ravenheart's keep perched on a hill overlooking you. Empty bottles gather in ditches by the side of the road, having stumbled down here after a dramatic toss from the fortress walls.
        # Heaping Trash, below, is already scavenged by lizards and rats for
        # "whatever missed morsels have yet to be plundered" — that's the
        # location's own words for prospecting.
        yield: { hunting: 1.0, prospecting: 1.0 }
        rooms:
          underlocks-dry-spring:
            name: Dry Spring
            description: >-
              Once a font of clear water, this rocky bed has long left weary travellers with parched throats.
          underlocks-heaping-trash:
            name: Heaping Trash
            description: >-
              A great mound of garbage of all descriptions, dumped here far enough from town to be out of sight. Small lizards and mammals frantically appear and disappear in and out of the mound, seeking to find whatever missed morsels have yet to be plundered.
            stash:
              items:
                skinned-cave-rat: 1
          underlocks-rat-warren:
            name: Rat Warren
            description: >-
              Thousands of rats scurry at the sight of you, this part of the mound being their place of shelter. Hundreds of apprehensive eyes watch you from the safety of their burrows.
            access: [animal-friend, musician]
            stash:
              items:
                rat: 8
      hills-shadowed-grove:
        name: Shadowed Grove
        attributes:
          wilderness: true
        map_node: 13
        description: >-
          As the light of the forest wanes, small white flowers fill the undergrowth. Thousands of them flourish where the forest and black hills collide.
        yield: { hunting: 1.0, prospecting: 0.5 }
        rooms:
          shadowed-grove-cairn:
            name: Nameless Cairn
            description: >-
              A painstakingly stacked pile of stones stands to the side of the road. Many have sought to topple it, yet someone or something always rebuilds it.
          shadowed-grove-outcrop:
            name: Rocky Outcrop
            description: >-
              Two stones lean upon each other for support, creating some of the only permanent shelter around. The underside of the rocks forms a grand battlefield, where colonies of moss and lichen compete for domination.
            stash:
              items:
                rock: 2
          shadowed-grove-clearing:
            name: Tranquil Clearing
            description: >-
              Tucked away far from the main path, an opening dominated by white flowers enjoys a little more sun than the rest of the hills nearby.
            access: [forester]
      hills-west:
        name: West Hills
        attributes:
          wilderness: true
        map_node: 25
        description: >-
          The path sits atop a slope looking out over two directions. To the South the land continues downward, dragging the river with it. To the East, the path rises once more before disappearing behind the hills.
        # A unique spot rather than a milder one like Shadowed Grove or Grand
        # Ravine: the Gallows below is a real grave (bones already sit there
        # as a room's static stash), and searching it has its own table
        # (LABORDROPS.md, laborTypeLocation.prospecting.hills-west).
        yield: { hunting: 1.0, prospecting: 0.8 }
        rooms:
          west-hills-crumbled-post:
            name: Crumbled Post
            description: >-
              A stake planted into the Earth which once bore signs directing travellers. Clearly someone decided the signs themselves were of more use in their own personal possession.
          west-hills-gallows:
            name: Forgotten Gallows
            description: >-
              A frayed noose hangs from a tree awaiting a guilty party. A pile of human bones rests peacefully below, having fallen free once the flesh suspending it decayed away.
            access: [cruel, mountaineering, adventurer, torturer]
            stash:
              items:
                foot: 2
                eye: 1
                bone: 8
                ravens-eye: 1
      hills-north:
        name: North Hills
        attributes:
          wilderness: true
        map_node: 26
        description: >-
          The path loses coherence as its stones give rise to gravel and stamped earth. All the trees nearby have lost their leaves and show no signs of growing anytime soon. Hollow winds kick up blackened dirt, unbound by grass or root.
        # An abandoned homestead with a locked hatch, and a basement full of
        # unlabelled tinctures, below — a real scavenging site.
        yield: { hunting: 1.0, prospecting: 1.0 }
        rooms:
          north-hills-homestead:
            name: Abandoned Homestead
            description: >-
              A decayed old home, built when the sun still graced this land. The interior is completely bare. It's a miracle the structure manages to stand with the gaping holes that line the walls. There is a locked hatch in the floor.
          north-hills-dead-end:
            name: Dead-end
            description: >-
              Leading off from the main path, this side path suddenly comes to a stop. Having come this far down this branch of the road you instinctively feel compelled to keep going, path or no path.
            stash:
              items:
                rock: 2
          north-hills-basement:
            name: Basement
            description: >-
              Shrivelled up locks of plants hang from hooks above drawers packed with phials of tinctures and rolls of crusted cloth. Lacking labels, your only hope is that whatever toxins they once contained have had enough time to denature.
            access: [brewing-skilled, caving]
            stash:
              items:
                mulligan-potion: 1
                invisibility-potion: 1
                mindbreaker-toxin: 1
                bliss: 1
                tea: 2
                obol: 10
          north-hills-lodestone:
            name: Lodestone
            description: >-
              Resting in a small clearing, covered with intricate carvings. The nature of the stone's origin and purpose elude you. Dark green grass grows at its base, surviving off its energy since the sun abandoned them.
            access: [esoteric, old-ways-thoth, superstitious]
      hills-waterway:
        name: Fracturing Waterway
        attributes:
          wilderness: true
        map_node: 27
        description: >-
          Ravenheart's river rushes downward towards the marshlands below. Beyond here it splits into a delta sustaining the marshes. A bridge offers crossing.
        # The Black Hills' one real river — panning fits as well here as it
        # does at the Forest's own water locations.
        yield: { hunting: 1.0, fishing: 0.8, prospecting: 1.0 }
        rooms:
          waterway-leopolds-bridge:
            name: "Leopold's Bridge"
            description: >-
              An ancient stone bridge originally dedicated to a revered Archbishop. It has fallen into disrepair, and a patchwork of wooden scaffolds cover the gaping hole that formed where the peak of the arch collapsed.
          waterway-eyot:
            name: Eyot
            description: >-
              Upstream of Leopold's Bridge, an island splits the river's stream in two before it reforms. A tiny, isolated ecosystem has formed here.
            access: [strong-swimmer]
            stash:
              resources: 4
      hills-gullies:
        name: Gullies
        attributes:
          wilderness: true
        map_node: 28
        description: >-
          The remains of an ancient riverbed guide the passage of hapless travellers, navigating between the domineering heights that surround it. It makes for a significantly easier journey than scaling each of the many hills.
        yield: { hunting: 1.0, prospecting: 0.6 }
        rooms:
          gullies-plateau:
            name: Wisened Plateau
            description: >-
              Where the slope encasing the road levels out, a small enclave forms to the side of the road. An old tree—rather short for its great width—grows here. The black leaves it hosts are the first on any tree for miles.
          gullies-fissure:
            name: Fissure
            description: >-
              A crack has broken in the road about two feet wide. Looking down, you can't seem to see quite how deep it goes. The distinct smell of sulfur seeps out of this festering wound in the Earth.
          gullies-burial-mound:
            name: Burial Mound
            description: >-
              Atop one of the heights beside the road sits a mound of earth many meters across. The dozens of small wooden crosses atop it give some hint as to what might lie beneath.
            access: [mountaineering]
      hills-grand-ravine:
        name: Grand Ravine
        attributes:
          wilderness: true
        map_node: 29
        description: >-
          Following the contours of the hills that surround it, the ravine is as constricting as it is expansive. A miasmic fog of decay sinks to the bottom, waiting to be blown away by winds that will never come.
        yield: { hunting: 1.0, prospecting: 0.5 }
        rooms:
          grand-ravine-echoing-halls:
            name: Echoing Halls
            description: >-
              Every sound here deflects off the walls of the ravine, creating a cacophony of sound. The walls of the ravine are host to far more plant life than the surface itself, the rocks seemingly a more hospitable environment.
            stash:
              items:
                rock: 2
          grand-ravine-trickling-water:
            name: Trickling Water
            description: >-
              A small stream of water seeps through the rock wall of the ravine. A bloated humanoid corpse decays nearby. All manner of small skittering things make pilgrimages to both. Severed heads in various states of decomposition rest atop wooden spikes nearby.
          grand-ravine-growth:
            name: Growth
            description: >-
              A strange coagulation of organic matter grows in cracks formed in the walls. It is a deep crimson red and looks wet to the touch. You wonder how deep into the walls this festering growth might reach.
            access: [esoteric, literate]
          # The Brigand camp, moved here from the old node 26 ravine with its
          # stash intact. `ravine-camp` is the knowledge tag, not this room's id.
          grand-ravine-camp:
            name: Ravine Camp
            description: >-
              Roots hang over the ravine ledge, further obscuring the hidden camp. There's meats drying on a rack, a couple of fires, and some stolen crates.
            access: [ravine-camp]
            stash:
              resources: 4
              items:
                spear: 2
                buckler: 2
                work-knife: 3
                mace: 1
                shortbow: 1
                padded-armor: 1
                padded-cap: 2
                hood: 2
                brigandine: 1
                skinned-cave-rat: 1
                disguise-kit: 1
                paper: 4
          grand-ravine-head-tent:
            name: Head Tent
            description: >-
              The largest of all the camp's tents. Inside are the most luxurious of amenities which the brigands have managed to get their hands on. One can only imagine how many secret stashes are hidden inside the tent, away from the grubby fingers of the rest of the camp.
            access: [brigand-leader]
            stash:
              resources: 4
              items:
                paper: 8
                obol: 23
                distilled-coca: 1
      hills-cliffs:
        name: Cliffs
        attributes:
          wilderness: true
        map_node: 30
        description: >-
          At the base of the mountains, tall walls of stone crush any hopes of travelling further East. High above some greenery has managed to grow, nestled in crags of the cliff faces. The lucky descendants of plants who managed to escape the fate beholden to the rest of the Black Hills.
        yield: { hunting: 1.0, prospecting: 0.6 }
        rooms:
          # The Forest's Cliffs already owns the `cliffs-` stem, and room ids
          # share one namespace, so these take the full location id instead.
          hills-cliffs-cave-mouth:
            name: Cave Mouth
            description: >-
              A hollow in the side of one of the cliffs leads ever deeper. The remnants of a camp setup before venturing inside are scattered about. A featureless wall of darkness awaits when looking inside, ready to consume any who venture too deep.
          hills-cliffs-overlook:
            name: Overlook
            description: >-
              Making the more manageable climb up one of the shorter cliffs, the top gives a view of the barren hills and valleys to the West, and sodden marshes to the South. You can just about make out the town itself at the other end of the valley.
            access: [mountaineering, climbing]

  marshes:
    name: Marshes
    kind: surface
    sort: 5
    description: >-
      Thick reeds crowd open-ended ponds. The western reaches are wooded swamps; placid clearings are rare in the fetid bogs. The east is more open, and eventually leads into an endless landscape of purple wetness.
    locations:
      marshes-village:
        name: Village
        description: >-
          Half-submerged houses connected by bridges, their owners gone. Cypress forms a thick treeline all around, their bases packed with cattails. There's big fish in the water.
        yield: { fishing: 1.0 }
        attributes:
          godflesh: true
        rooms:
          village-bridges:
            name: Bridges
            description: >-
              Algae clings to the bridges, connecting flooded homes.
          village-bighook-maw:
            name: Bighook Maw
            description: >-
              An abandoned pub. The cellar's still there, but it's flooded. You'd have to be a good swimmer to get in there.
          # Private, so the thread itself is invisible to anyone who can't
          # swim — the nearest thing the schema has to a hidden room.
          village-flooded-cellar:
            name: Cellar
            description: >-
              A waterlogged cellar. There's a crate down there — you'd have to be a good swimmer to get it.
            access: [strong-swimmer]
            stash:
              items:
                flooded-crate: 1
                poppy-pods: 1
          village-old-hut:
            name: Old Hut
            description: >-
              A hut elevated over the marsh, half an hour's walk out of the village proper. The village's last inhabited building.
            access: [fishermans-key]
            stash:
              items:
                obol: 2
                rat: 1
                poppy-pods: 1
      factory:
        name: Godard Factory
        indoors: true
        description: >-
          A huge, wooden warehouse elevated above a shallow lake. Rickety bridges connect the various sheds, barrels, and winches. Electric lamps hang overhead, holding back the darkness. You can hear the insects and frogs every night. `GODARD FACTORY` is printed in white. Raven banners hang over the entrance.
        # No `yield:` — refining is not a labor coefficient. `refinery` is what
        # makes laboring legal here at all, and what it pays in.
        attributes:
          refinery: true
          noticeboard: true
        rooms:
          factory-logistics-room:
            name: Logistics Room
            description: >-
              The Godflesh is prepared for production here while Squeeze is stacked into neat little crates. There's a ramp leading down to dry ground, where the cart is usually staged.
            access: [factory-key]
            stash:
              resources: 2
              items:
                packaging-equipment: 1
                armored-gloves: 2
                hatchet: 1
          factory-main-floor:
            name: Main Floor
            description: >-
              The production room. Godflesh, suspended by hooks, slowly boils in big, wood-fired vats. Hydraulic pistons then senselessly compress it into cubes. Outside, the bridges have a few tables for people to kick their feet and relax. The Days Since Last Incident ticker is covered over by a hastily painted sign saying: "DO NOT EAT THE CUBES." A level up, the overseer box looks out onto the working floor.
            stash:
              items:
                hatchet: 1
          factory-pub:
            name: Pub
            description: >-
              An old barge converted into a pub for the factory workers. When the nearby village was more active, there was an actual bar. Well, at least you have moonshine, and some interesting folks still pass by.
            stash:
              items:
                hatchet: 1
          # `destroys` is the only room in the game with it. See CARRY.md.
          factory-spillway:
            name: Spillway
            description: >-
              An open-air wooden trough where acidic, pink-stained wastewater cascades into the lake. Anything you drop here is gone for good.
            destroys: true
          factory-overseer-box:
            name: Overseer Box
            description: >-
              Clear sightways into the factory and out to the surrounding marsh, leading to a walkway that wraps around the factory's upper levels.
            access: [bannerets-key]
            stash:
              resources: 8
              items:
                obol: 5
                cleaning-powder: 1
                military-autoinjector: 1
                paper: 9
                bannerets-wax-stamp: 1
                cigarette: 1
      marshes-north:
        name: North Marshes
        map_node: 31
        description: >-
          The land flattens into water, reeds, and the cloudy sky. Warm shallows stretch between muddy hummocks beneath clouds of mosquitos, while low yellow fog rolls through wherever the water turns stagnant. Wind rustles through the reeds in great bands, carrying the smell of rot and distant splashing much farther than expected.
        yield: { hunting: 1.0, fishing: 1.0 }
        attributes:
          wilderness: true
          godflesh: true
        rooms:
          north-marshes-cages:
            name: Cages
            description: >-
              Iron cages stand on isolated hummocks along the decrepit, ramshackle path. Most rusted open and empty. A few remain locked, their lower halves submerged into parts of the marsh, with scratches covering the bars from the inside.
          north-marshes-reeds:
            name: Reeds
            description: >-
              Shoulder-high reeds spread in every direction, swallowing trails only a few yards after they are made.
          north-marshes-longwater:
            name: Longwater
            description: >-
              One of the few dependable channels through the marsh. The dark water runs slow but deep enough for a skiff. Long wakes disturb the surface where nothing can be seen beneath, while mosquitos gather thickly over the warmer banks.
      marshes-west:
        name: West Marshes
        map_node: 32
        description: >-
          Broad old trees gather along slow, dark channels, their limbs stretching low enough to almost brush the water. Grass grows thick on the higher banks, while lilies and floating weeds collect in the quieter bends below. The woods feel open at first glance, dappled with warm light and broad patches of green, but the ground is divided by creeks, flooded hollows, and soft banks that give way underfoot. Frogs call from the water and insects hang in the still air beneath the canopy.
        yield: { hunting: 1.0, fishing: 1.0 }
        attributes:
          wilderness: true
          godflesh: true
        rooms:
          west-marshes-backwater:
            name: Backwater
            description: >-
              A horseshoe bend cut off from the main current, thick with lilies, duckweed, and insects. Fish disturb the otherwise glassy surface, and fallen branches gather in heaps wherever the water narrows. The frogs can be heard loudly.
          west-marshes-fallen-crossing:
            name: Fallen Crossing
            description: >-
              A storm-toppled oak bridges one of the deepest channels from bank to bank. Its upper branches have been cut away over the years, leaving a broad, weather-smoothed road.
          west-marshes-frog-hollow:
            name: Frog Hollow
            description: >-
              Behind a curtain of reeds, a narrow side-channel opens into a sheltered pool almost completely enclosed by roots and low branches. Hundreds of frogs gather along the muddy banks, on half-sunken logs, and across broad lily pads, filling the hollow with a constant chorus of croaks.
            access: [forester, animal-friend]
            stash:
              items:
                old-coin: 9
      marshes-woods:
        name: Woods
        map_node: 33
        description: >-
          Trees knot together above narrow ridges of mud and thickets wide enough to force travelers into whatever passages remain open. The air hangs hot and wet beneath the canopy, heavy with mosquitos and the sweet-sour smell of flooded vegetation. Pale fog settles into the lowest hollows and turns trunks into indistinct shapes.
        yield: { hunting: 1.0, fishing: 1.0 }
        attributes:
          wilderness: true
          godflesh: true
        rooms:
          woods-hanging-trees:
            name: Hanging Trees
            description: >-
              A cluster of trees that bear hundreds of ribbons, bells, bones, and scraps of clothing tied high among the branches, some old enough to have been swallowed halfway into the bark.
          woods-deadfall:
            name: Deadfall
            description: >-
              An entire patch of forest was flattened during some long-past storm. Uprooted trees have left pits full of rainwater beside great walls of exposed roots, while new saplings grow through the bleached remains of the old forest.
          woods-mirebed:
            name: Mirebed
            description: >-
              Beneath interlocking roots, an area opens into a dry island of peat and old bone. Curled at its center lies something enormous beneath a blanket of moss: a lion-like body the size of a cottage, one horned head tucked beneath a folded wing, while a second shape—another neck—disappears beneath its mane. Each breath slow, and mushrooms have begun growing from the mud accumulated along its back. It sleeps no matter what you do.
            access: [forester, tracking]
            stash:
              items:
                coal: 2
      marshes-drowned:
        name: Drowned Marshes
        map_node: 34
        description: >-
          This place is open. The drowned basin spreads beneath an open sky, its surface broken by the occasional raft of floating vegetation. In still weather, the surface becomes perfectly reflective, doubling the trees and clouds until the horizon seems uncertain. There is little shelter and less solid ground, only water stretching between scattered remnants of what once grew there.
        yield: { hunting: 1.0, fishing: 1.0 }
        attributes:
          wilderness: true
          godflesh: true
        rooms:
          drowned-marshes-stillwater:
            name: Stillwater
            description: >-
              The basin’s center is deep, exposed, and almost entirely free of vegetation. On calm days the water becomes mirror-flat, making distant trees and clouds difficult to distinguish from their reflections.
          drowned-marshes-crypt:
            name: Crypt
            description: >-
              A drowned burial chamber rests beneath the tower, its niches filled with black water and pale silt. Several sarcophagi have split open under the pressure. A narrow opening beneath the eaves leads into an air pocket trapped against the ceiling. Rusted hooks and a heavy iron bell remain inside, along with whatever was abandoned when the water rose.
            access: [strong-swimmer]
            stash:
              items:
                obol: 4
                cross: 1
                vestments: 1
      marshes-south:
        name: South Marshes
        map_node: 35
        description: >-
          Wet grass and pale limestone share the ground in uneasy patches, cut through by clear streams that vanish abruptly into cracks in the earth. Shallow hollows gather rainwater between shelves of exposed stone, while larger depressions fall away into shadow beneath hanging roots and scrub.
        yield: { hunting: 1.0, fishing: 1.0 }
        attributes:
          wilderness: true
          godflesh: true
        rooms:
          south-marshes-pocked-grounds:
            name: Pocked Grounds
            description: >-
              Shallow hollows interrupt an otherwise open stretch of wet grass. Most are harmless bowls of mud and rainwater, though several conceal narrow openings between limestone shelves.
          south-marshes-great-sink:
            name: Great Sink
            description: >-
              A huge depression has collapsed into the limestone, leaving a steep bowl lined with scrub, loose rock, and exposed roots. At its lowest point, several cave mouths disappear beneath an overhang where daylight barely reaches.
          south-marshes-rootmouth:
            name: Rootmouth
            description: >-
              A seemingly ordinary hollow beneath an old tree conceals a crack large enough to squeeze through. Its roots hang into a narrow limestone chamber below, twisted around fallen stones like ropes. A ledge follows the wall above a subterranean stream before disappearing deeper beneath the fen.
            access: [caving]
            stash:
              items:
                graga-corpse: 1
  # --- Underground (group) ---
  # Category + GM seat only, NOT a standable place: no #summary, no "Zone:
  # Underground" access role, and it never appears in connections. Its
  # `levels:` map is flattened by the sync into two real zones (caves /
  # depths), each shaped like a surface zone minus `kind`; their Location
  # channels parent to this one category.
  #
  # The kinds are kept rather than promoting Caves and Depths to surface
  # zones because the Caving Die only rolls on a CAVE_LEVEL arrival
  # (docs/systemdocs/CAVING.md), and a CAVE_LEVEL needs a CAVE_GROUP parent.
  # Sharing a parent also means they share one GM seat, which is what the
  # Caves seat already did across three levels.
  underground:
    name: Underground
    kind: group
    sort: 6
    description: >-
      The mouth to the other world.
    levels:
      caves:
        name: Caves
        sort: 1
        description: >-
          Wet, dimly-lit caves. The main paths have been smoothed down by centuries of traffic, but side paths and natural holes descend into darkness.
        locations:
          # The sentry post at the cave mouth. The merchant's berth next door is
          # its own Location again (`depot`, below) — they were merged because
          # the two used to stand with NO edge between them, so a migrant who
          # cleared customs could not then walk to the shop. The plain
          # customs ↔ depot pair in `connections:` is what keeps that from
          # coming back; do not remove it while these are two places.
          customs:
            name: Customs
            indoors: true
            attributes:
              noticeboard: true
              safe: true
            description: >-
              Inside the cave's mouth, the ceramite watchtower beholds migrants and mercenaries as they talk around a campfire. It's all illuminated by a pair of floodlights, connected by a suspended cable.
            rooms:
              customs-yard:
                name: Customs
                description: >-
                  Migrants set up tents here, awaiting someone to create their necessary paperwork.
                stash: [skinned-cave-rat]
              customs-watchtower:
                name: Watchtower
                access: [cerberus-key, cerberon, knighted, barons-key, hands-key, censors-key]
                description: >-
                  Set into the gate. The tower's windows allow peering into the caves, where a floodlight is pointed. Metal grates on the floor allow pouring oil onto any invaders.
                stash:
                  items:
                    paper: 8
                    shortbow: 1
                    spear: 1
          # The merchant's berth, over the cave-river from the sentry post. A
          # built place, so a bare slug and a bare name (there is one Depot).
          # `safe:` is not decoration here: without it this is a CAVE_LEVEL
          # arrival like any other and the Caving Die would roll on every
          # single shop trip.
          depot:
            name: Depot
            indoors: true
            attributes:
              depot: true
              noticeboard: true
              safe: true
            description: >-
              Warm incandescent lights beckon travelers over a cave-river into the rusted, metal depot. It's bedecked in furs, banners, and comfortable chairs.
            rooms:
              depot-storefront:
                name: Storefront
                description: >-
                  An unwashed rug and shelves with various goods, and also a bar for boozing up the patrons before they decide to buy. A shutter can be raised and lowered to close the windows and protect the door. There's a turret on the roof. Stairs lead down to the shuttle landing pad.
                stash: [tea, sweets]
              depot-landing-pad:
                name: Landing Pad
                live: shuttle
                description: >-
                  A grated steel bay. The roof automatically opens and closes.
              depot-merchants-office:
                name: Merchant's Office
                access: [merchants-license]
                description: >-
                  A desk, filing cabinets, and a big red button.
                stash:
                  items:
                    paper: 32
              # The lock moved off the Landing Pad and onto here: the pad is
              # just a hole in the roof, but the goods are worth a door.
              depot-cargo-bay:
                name: Cargo Bay
                access: [depot-keycard]
                description: >-
                  Shelves on either side, stacked high with crates.
                stash:
                  resources: 4
                  items:
                    hard-cheese: 1
                    obol: 10
                    cargo-crate: 1
                    paper: 6
                    merchants-wax-stamp: 1
                    # The Company's own crating bench, alongside the Factory's
                    # in factory-logistics-room. The Depot sells the crates and
                    # the Merchant fills them, so the outfit that ships the
                    # goods can pack them without walking to the Marshes.
                    # Untradeable, so it is a fixture here and weighs nothing —
                    # see the note on the tag in docs/tags.yaml.
                    packaging-equipment: 1
          # Prospecting joined 2026-09-09 (LABORING.md §3a) as every Cave and
          # Depths location's fourth yield — mines, tunnels and an ore vein
          # were already the fiction down here (see the Old Mineshaft room
          # below, and chasm-ore-vein further down), so digging started where
          # digging already made sense. It's not mining-only everywhere,
          # though — see the Forest's own rows, further up, for the panning
          # and scavenging side of it.
          caves-approach:
            name: Approach
            map_node: 14
            indoors: true
            description: >-
              A long time ago, a great foe threatened Ravenheart from the caves. The mines laid by the Baron still patiently wait for the invading army. The stench of decaying remains scattered with explosive force is surprisingly meagre. Gnawed bones are the only proper remains to be seen.
            yield: { hunting: 0.4, prospecting: 0.5 }
            rooms:
              approach-hut:
                name: Abandoned Hut
                description: >-
                  A small structure, once built by someone exiled from Ravenheart. It now serves as a rest stop for migrants on their way through the caves.
                # One of five wheels of Hard Cheese put away across the game's cellars and stores (docs/systemdocs/COOKING.md). A seed, not a supply: db/lib/syncZones.js#seedRoomStash never tops a room up, so once these five are eaten there are no more.
                stash:
                  items:
                    hard-cheese: 1
              approach-mineshaft:
                name: Old Mineshaft
                description: >-
                  A winding mineshaft burrowed into the cave wall. It once brought great wealth and prosperity to Ravenheart. Most of it has collapsed in on itself since then.
                stash:
                  items:
                    black-powder: 1
                    coal: 1
                    rock: 3
              approach-nekker-den:
                name: Nekker Den
                description: >-
                  A host of Nekkers has made this secluded corner of the mineshaft home. They come scampering out at the sound of landmines going off, seeking to feast on the remains.
                access: [dwarf, tracking, tunnel-rat, caving]
                stash:
                  items:
                    nekker-pheromones: 1
                    nekker-corpse: 1
                    feces: 2
                    dagger: 1
          caves-walkways:
            name: Walkways
            map_node: 15
            indoors: true
            description: >-
              Numerous stone walkways connect side tunnel entrances over a large pit. At the centre of the chamber above the pit is a pillar of stone that serves as the point at which the walkways meet. It is impossible to say just how deep the pit is.
            yield: { hunting: 0.4, prospecting: 0.5 }
            rooms:
              walkways-central-spire:
                name: Central Spire
                description: >-
                  A spire of stone, to which the walkways connect. Its several meter radius is a great relief after having had to walk so carefully over the narrow walkways. A burnt-out fire pit has been set up in the middle.
                stash:
                  items:
                    rock: 2
              walkways-walkways:
                name: Walkways
                description: >-
                  With a width of only a few feet, the walkways require graceful footwork. Looking down below from the walkway, you can't help but notice how long of a way down it is below.
              # Enterable only by holding `cave-pit`, which nothing grants on
              # its own — a GM hands it out from /gm/dev when somebody falls.
              walkways-pit:
                name: Pit
                description: >-
                  The walkways overhead are a long way up. Let's hope you have the strength to reach them.
                access: [cave-pit]
                stash:
                  items:
                    feces: 1
                    skinless-corpse: 1
                    obol: 8
          caves-brooding-grounds:
            name: Brooding Grounds
            map_node: 16
            indoors: true
            description: >-
              A winding forest of mushrooms, home to every manner of skulking thing. Any attempt to establish a proper path through has been quashed by the fungi's competition over the limited space. Navigating through, you can hear the sound of things scraping through the forest around you.
            yield: { hunting: 0.4, prospecting: 0.5 }
            rooms:
              brooding-burrows:
                name: Burrows
                description: >-
                  Tucked into a long ditch in the Earth amongst the shrooms are rows of small holes into the ground. You can't see any of the burrow's residents, either none are home or they dashed inside long before you emerged into the clearing.
                stash:
                  items:
                    rock: 2
              brooding-dense-mycelium:
                name: Dense Mycelium
                description: >-
                  A thick overgrowth of mycelial threads flow from the ceiling. You can barely see more than five feet ahead and moving through the dense fungi is a struggle.
                # Deep Morels, scattered by hand (docs/systemdocs/COOKING.md). Raw they are a bad night; cooked they are one of the better things in the game, and they only grow down here.
                stash:
                  items:
                    deep-morel: 1
              brooding-picnic-table:
                name: Picnic Table
                description: >-
                  A simple wooden table set up with log stools arrayed around it. Any food set up has long since been pilfered by local creatures. You can feel an ancient presence watching and patiently observing.
                access: [esoteric, old-ways-sylvia, mad-doctor]
                stash:
                  items:
                    cave-fungus: 2
              brooding-godshroom:
                name: Godshroom
                description: >-
                  In an open clearing, a Godshroom rises above the shroom cap canopy. Its pores ooze a viscous orange liquid, dripping down onto the earth beneath it. You feel more watched than ever.
                access: [forester, animal-friend]
                stash:
                  items:
                    deep-morel: 4
                    cave-fungus: 6
          caves-abandoned-camp:
            name: Abandoned Camp
            map_node: 17
            indoors: true
            description: >-
              What remains of an old campsite, picked clean by years of travellers passing through. Everything of any value has long been scavenged, alongside many things of no value whatsoever.
            yield: { hunting: 0.4, prospecting: 0.5 }
            rooms:
              abandoned-camp-main:
                name: Main Camp
                description: >-
                  Some hefty stones are gathered in a circle at the centre. Dotted around are metal tent pegs buried too deeply in the stone to be stolen. The only other remaining evidence of this place ever being inhabited are the various piles of trash littering the campsite.
                stash:
                  items:
                    obol: 2
                    rock: 4
              abandoned-camp-shroom-mound:
                name: Shroom Mound
                description: >-
                  Nearby to the former campsite mounds of earth have been piled up, with colonies of bright red mushrooms flourishing atop them. Clearly whatever is buried here is greatly to the mushroom's preference.
                # Deep Morels, scattered by hand (docs/systemdocs/COOKING.md). Raw they are a bad night; cooked they are one of the better things in the game, and they only grow down here.
                stash:
                  items:
                    deep-morel: 1
              abandoned-camp-stash:
                name: Stash
                description: >-
                  Hidden under a flat rock is an opening into the cave floor. Inside is a small room full of bottles of clear liquid.
                access: [caving, alcoholic]
                stash:
                  resources: 3
                  items:
                    hard-cheese: 1
                    alcohol: 3
                    ravenheart-red: 1
                    moonshine: 3
                    obol: 17
      depths:
        name: Depths
        sort: 2
        description: >-
          A place of true darkness. The end of the world.
        locations:
          depths-steel-wall:
            name: Steel Wall
            map_node: 18
            indoors: true
            attributes:
              noticeboard: true
            description: >-
              At the end of the cave system stands a wall of solid metal. Grime and rubble have piled up against it. The places where it remains bare, its surface is near perfectly smooth.
            yield: { hunting: 0.6, prospecting: 0.7 }
            rooms:
              steel-wall-perimeter:
                name: Barren Perimeter
                description: >-
                  The opening around the wall itself is comparatively expansive for the cave. Worn down concrete spikes jut out from the floor, warding those who venture this far away. The walls are softly illuminated by pools of light, seeping from the rocks themselves.
                stash:
                  items:
                    rock: 3
              steel-wall-etchings:
                name: Cave Wall Etchings
                description: >-
                  The walls are covered in etchings. The finer letters cannot be discerned, but you see crudely engraved images of structures, people and faces. You feel the sudden urge to contribute your own inane scrawling to this mosaic of nonsense.
              steel-wall-corridor:
                name: Corridor
                description: >-
                  A dark, featureless corridor has opened in the wall. Going inside, your ears start to ring. Approaching the end of the corridor you reach a room with rows of broken terminals on the walls. Atop the tables and desks lining the edge of the room are strange objects. Two further doors at either side of the room are firmly shut.
                access: [ancient-keycard]
                stash:
                  items:
                    energy-shield: 1
                    paper: 29
                    old-coin: 45
          depths-obelisk:
            name: Obelisk
            map_node: 19
            indoors: true
            description: >-
              A pillar of rusted steel sits in the centre of the chamber, surrounded by scattered pieces of metal and strange instruments. The stone on which the obelisk sits seems to have been stained black. You can taste metal in your mouth.
            yield: { hunting: 1.8, prospecting: 0.7 }
            rooms:
              obelisk-machinery:
                name: Strange Machinery
                description: >-
                  Strewn across the floor around the Obelisk, odd gadgets and mechanical instruments whose purpose eludes you. You wonder what they might be for, and what they might be worth to someone.
              obelisk-cove:
                name: Cove
                description: >-
                  A squat tunnel attached to the obelisk's chamber leads into a small open crawlspace. Metal boxes are strewn throughout the space, all of them are empty aside from a locked few whose contents are unknown. You feel clearheaded in here.
                access: [caving]
                stash:
                  items:
                    supply-kit: 3
                    purse: 2
                    bastard-sword: 1
                    old-coin: 9
                    trapping-gear: 1
          depths-last-chance:
            name: Last Chance
            map_node: 20
            indoors: true
            description: >-
              The great hollow chambers that dominate the depths to the East meet their end here. Crackling flashes of light illuminate the cavern wall as it makes a sharp turn north, leading upwards out of the depths. A tunnel has been bored into a smaller cavern system to the West, and a plaque inlaid into the wall beside it.
            yield: { hunting: 0.6, prospecting: 0.7 }
            rooms:
              last-chance-halls:
                name: Halls of Lightning
                description: >-
                  Tall shrooms sprout from the Earth and gather static charge. Occasionally a flash of light erupts as a current forms between two neighbouring stalks.
              last-chance-warning:
                name: Western Warning
                description: >-
                  A great plaque of unrusting solid metal is implanted into the cave wall. It bears symbols and patterns completely alien to you. You have heard stories about this place, none of them good.
              last-chance-convoy:
                name: Lost Convoy
                description: >-
                  A collection of carts and wagons, bearing long spoiled produce. The carts stand on decayed crumbling wheels, surrounded by the remains of their owners. There is a trove of wooden crates untouched, waiting to be plundered. You feel strange.
                access: [tracking, spotter, convoy-directions]
                stash:
                  items:
                    cart: 1
                    obol: 46
          depths-fork:
            name: Fork
            map_node: 21
            indoors: true
            description: >-
              A simple choice awaits those who pass this way, the tunnel branches into two possible directions. Such a simple choice is complicated by the overwhelming smell of stagnant water and charred ash. The air itself seems thick.
            yield: { hunting: 0.6, prospecting: 0.7 }
            rooms:
              fork-cobbles:
                name: Brittle Cobbles
                description: >-
                  Something crunches underfoot here with each step. The air is thick is fine particles of dust disturbed by careless feet. Everything is coated with a thick layer of dirty grey dust, catching the light of passing torches.
                stash:
                  items:
                    rock: 3
              fork-sullen-mist:
                name: Sullen Mist
                description: >-
                  The roaring of falling water as you enter the bottom of a great pit from a side entrance. Water falls from above crashing into the pit, filling it with a thick, choking mist, before streaming further down.
              fork-charred-lair:
                name: Charred Lair
                description: >-
                  Blacked bones crack and disintegrate under your weight with each step. The sound is deafening against the total silence in here.
                access: [sixth-sense, adventurer, brave]
                stash:
                  items:
                    coal: 12
                    black-powder: 8
                    saltpeter: 4
          depths-grand-chamber:
            name: Grand Chamber
            map_node: 22
            indoors: true
            description: >-
              A large singular open chamber held up by great pillars of stone. It must be hundreds of feet in height, and echos return minutes later from the other side.
            # `fishing` is here rather than on the room, because a yield is a
            # property of the Location — it is what makes the Deep Sea's
            # "you can fish here" true for the Labor pass.
            yield: { hunting: 0.6, fishing: 0.9, prospecting: 0.7 }
            rooms:
              grand-chamber-expanse:
                name: Expanse
                description: >-
                  A whole word of darkness, you could walk for miles in any direction. Occasionally you will encounter one of the enormous pillars holding the ceiling up. The pillars seem to be of similar diameters but bear no discernible markings.
              grand-chamber-slope:
                name: Slippery Slope
                description: >-
                  The southern edge of the chamber never seems to end but merely descends deeper. The floor falls into a steeper and steeper slope. Who knows where it leads.
                stash:
                  items:
                    rock: 2
              grand-chamber-deep-sea:
                name: Deep Sea
                description: >-
                  At the bottom of the slope rests a great lake, fed by trickling groundwater. Just at the water level someone has carved an indent in the slope to sit without sliding into the water. You can fish here.
                access: [mountaineering, caving]
                stash:
                  resources: 9
                  items:
                    deep-morel: 1
                    fishing-rod: 1
          depths-crystal-chambers:
            name: Crystal Chambers
            map_node: 23
            indoors: true
            description: >-
              A maze of interconnected chambers, all hosting great crystalline growths of varying colours and shapes. What light does make its way in here is reflected in every possible direction, creating strange constellations of reflections.
            yield: { hunting: 0.6, prospecting: 0.7 }
            rooms:
              crystal-chambers-razor-tunnels:
                name: Razor Tunnels
                description: >-
                  Tiny brittle crystals cut into your clothes as your brush past them. Scratches on the skin left by them itch for hours, giving no respite. The narrow tunnel requires you carefully climb through countless of these vicious crystals.
              crystal-chambers-screaming-room:
                name: Screaming Room
                description: >-
                  You keep hearing shrill ringing from this part of the cavern but entering inside always find it perfectly quiet here. The inside appears identical to all the other cavern chambers you have passed through to get here.
              crystal-chambers-eusoch:
                name: Manifestation of Eusoch
                description: >-
                  A wrinkled stone face petrified before you. The chamber is filled with a ghostly light whose source you cannot pinpoint.
                access: [old-ways-eusoch]
              crystal-chambers-mirror-pool:
                name: Mirror Pool
                description: >-
                  A pool has formed at the centre of this room. Perfectly still, were you not in pitch darkness you would see your own tormented reflection.
                access: [caving, vain]
          # The Depths' best Prospecting (1.4, versus 0.7 everywhere else down
          # here) — the same reasoning depths-obelisk gets the best Hunting:
          # this is the one place with an actual named vein
          # (chasm-ore-vein, below).
          depths-chasm:
            name: Chasm
            map_node: 24
            indoors: true
            description: >-
              The Earth has been split here. This steep crack is what remains. The smell of sulfur flows out of the chasm from the numerous smaller tunnels that connect to it at its base. Some of these tunnels can lead even deeper into the depths, for better or worse.
            yield: { hunting: 0.6, prospecting: 1.4 }
            rooms:
              chasm-outcrop:
                name: Outcrop
                description: >-
                  A ledge of rock provides a place of respite from the otherwise sheer walls of the chasm. Additionally, it serves as an approximate halfway point when climbing to or from the way out of the chasm and the multitude of side tunnels at the very bottom.
                stash:
                  items:
                    rock: 2
              chasm-ravines-end:
                name: "Ravine's End"
                description: >-
                  The deepest extent of this rift in the land, looking up you can see a crack of light. Tunnels in the sides of the walls continue ever deeper, promising to deprive you of any sunlight at all.
              chasm-ore-vein:
                name: Ore Vein
                description: >-
                  One of the many holes bored into in walls of the ravine reveals a trove of ore. We're rich!
                access: [laboring-skilled, caving, prospectors-notes]
                stash:
                  resources: 95
              # The Pray button lives here and nowhere else — its slug is
              # hardcoded in db/lib/xom.js the way the bell's and the turret's
              # are, and db/lib/placeAffordances.js hangs the affordance off
              # it. Renaming this id moves the shrine to a room nobody can
              # reach; keep them in step.
              #
              # Deliberately not in the Crystal Chambers beside the
              # Manifestation of Eusoch: two god-faces in one Location teaches
              # players that the pantheon lives in exactly one room, and the
              # two shrines are inverses worth keeping apart — Eusoch's admits
              # only people who already believe, this one admits any caver and
              # hands the belief out.
              chasm-shrine-of-an-old-man:
                name: Shrine of an Old Man
                description: >-
                  A shrine of a twisted-looking, aged face. It brims with crazed power.
                access: [caving]

connections:
  # --- Fortress ---------------------------------------------------------
  - [fortress/servant-wing, fortress/lifeweb]
  - [fortress/servant-wing, fortress/keep]
  - [fortress/servant-wing, fortress/undercroft]
  - [fortress/lifeweb, fortress/gatehouse]
  - [fortress/keep, fortress/undercroft]
  - [fortress/keep, fortress/garrison]
  - [fortress/keep, fortress/gatehouse]
  - [fortress/garrison, fortress/gatehouse]
  - [fortress/road, fortress/manors]
  # The one edge that is two things at once. A Cerberus on the gate reads
  # everyone's papers, and the portcullis winch can be dropped by anyone with
  # the authority to work it.
  - pair: [fortress/gatehouse, fortress/road]
    announce: true_name
    modular:
      open: true

  # --- Town -------------------------------------------------------------
  - [town/north-gate, town/cathedral]
  - [town/north-gate, town/sanctuary]
  - [town/cathedral, town/square]
  - [town/sanctuary, town/square]
  - [town/sanctuary, town/old-cock-inn]
  - [town/sanctuary, town/underquarter]
  - [town/underquarter, town/old-cock-inn]
  - [town/square, town/old-cock-inn]
  - [town/square, town/south-gate]

  # --- Forest -----------------------------------------------------------
  - [forest/forest-headwaters, forest/forest-cliffs]
  - [forest/forest-headwaters, forest/forest-creekside]
  - [forest/forest-cliffs, forest/forest-northern-road]
  - [forest/forest-creekside, forest/forest-west-riverbank]
  - [forest/forest-creekside, forest/forest-deep-forest]
