  # --- Caves ------------------------------------------------------------
  # The gate in the cave mouth. Nobody stands on it, so it records what a
  # passer-by would have seen rather than who it was — the watchtower above it
  # is where somebody would actually be looking.
  - pair: [caves/customs, caves/caves-approach]
    announce: concealed
    modular:
      open: true
  - [caves/caves-approach, caves/caves-abandoned-camp]
  - [caves/caves-walkways, caves/caves-brooding-grounds]
  - [caves/caves-brooding-grounds, caves/caves-abandoned-camp]
  # Over the cave-river, from the sentry post to the shop. A plain pair on
  # purpose: same zone, so it is free on the location-move cooldown, and both
  # ends are `indoors`, which already parks a mount at the door — `on_foot`
  # would refuse the crossing instead of stabling the horse. This edge is the
  # whole reason these two can be separate Locations; the last time they were,
  # it was missing, and a migrant who cleared customs could not walk to the
  # shop.
  - [caves/customs, caves/depot]
  # The mushroom forest's own way into the cargo bay, which is how the
  # merchant's crates get in without passing the sentry at the gate.
  - pair: [caves/depot, caves/caves-brooding-grounds]
    hidden: caving
    on_foot: true

