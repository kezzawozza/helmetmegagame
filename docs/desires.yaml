  # XOM. The only Desire a plaything of Xom has left — {tag:old-ways-xom}
  # locks every family but `chaos`.
  #
  # The extra families are LOCK-SURVIVAL KEYS, not taxonomy, and removing them
  # would bench somebody. unionLockClauses unions every held tag's clauses, so
  # a holder who also carries {tag:rage} (exceptFamilies: [cruelty]) has this
  # locked too unless it also sits in `cruelty` — and one who carries
  # {tag:stupid} (exceptFamilies: [alcohol, stupidity]) needs `stupidity` for
  # the same reason. Xom inflicts BOTH on itself: `rage` is one of its
  # outcomes, and its `seizure` outcome expires into `stupid`. The
  # requires.anyTags gate keeps the goal out of everyone else's picker
  # regardless, so the extra families cost nothing and are the only thing
  # standing between a Rage+Xom character and a sheet with no reachable goal.
  #
  # cooldownTurns is 2, not the tier's own 2 by accident: it is written down so
  # nobody "tidies" it up the free-social ladder to 4. This is the character's
  # ONLY goal, and a 4-turn cooldown benches them three turns in four — the
  # exact failure the `stupidity` family exists to prevent.
  cause-chaos:
    name: Cause Chaos
    tier: 2
    cooldownTurns: 2
    families: [chaos, cruelty, stupidity]
    requires:
      anyTags: [old-ways-xom]

